version: '3.9'

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: pathforge
      POSTGRES_PASSWORD: pathforge
      POSTGRES_DB: pathforge_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/api:/usr/src/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  web:
    build: ./apps/web
    command: npm run dev -- --hostname 0.0.0.0
    volumes:
      - ./apps/web:/usr/src/app
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  pgdata:
